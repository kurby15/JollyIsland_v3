<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JollyIsland Management System</title>
    <script>
      (function () {
        var base = "/jollyisland_v3/";
        var pathname = window.location.pathname || "/";
        var route =
          pathname.indexOf(base) === 0
            ? pathname.slice(base.length)
            : pathname.replace(/^\//, "");
        var target =
          base + "#" + (route ? "/" + route.replace(/^\//, "") : "/");
        window.location.replace(target);
      })();
    </script>
  </head>
  <body></body>
</html>
